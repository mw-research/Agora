# Baut das Container-Image und legt es in die GitHub Container Registry.
#
# Nuetzlich, wenn auf dem Zielsystem kein Docker laeuft: der Cluster zieht
# das Image dann aus ghcr.io statt es selbst zu bauen. Wer lieber selbst
# baut, braucht das hier nicht.
#
# Nach dem ersten erfolgreichen Lauf das Paket auf "public" stellen
# (Profil -> Packages -> agora -> Package settings -> Change visibility),
# sonst braucht der Cluster zusaetzlich einen imagePullSecret.
name: Image bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Ohne Buildx laeuft der Build mit dem einfachen docker-Treiber, und der
      # kann den GitHub-Actions-Cache unten nicht exportieren.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora
          # Bewusst OHNE type=sha: das legte fuer jeden einzelnen Commit auf
          # main eine eigene, dauerhaft bleibende Paketversion an - nach ein
          # paar Wochen Entwicklung sind das dutzende Leichen. Wer einen
          # bestimmten Stand festhalten will, setzt einen Tag v1.2.3; der
          # bekommt seine eigene Version und bleibt.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bewusst ohne cache-from/cache-to: der GitHub-Actions-Cache
          # (type=gha) bricht seit der Umstellung der Cache-API haeufig ab,
          # und der Build dauert ohnehin nur ein bis zwei Minuten.

      # Jeder Push auf main schiebt "latest" weiter; die vorige Version bleibt
      # als unbenannte Leiche liegen. Die hier raeumt sie weg.
      #
      # delete-only-untagged-versions ist die EINZIGE sichere Schranke. Nicht
      # in Versuchung kommen, stattdessen ueber ignore-versions zu filtern:
      # das Muster wird gegen den Versions-NAMEN geprueft, und der ist bei
      # Container-Paketen die Digest-Pruefsumme, nicht der Tag. Ein Muster
      # wie ^(latest|v.*)$ trifft dort also nie - und loescht damit alles,
      # auch latest. Genau so ist am 21.09.2026 das ganze Paket verschwunden.
      - name: Namenlose Altlasten entfernen
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: agora
          package-type: container
          delete-only-untagged-versions: true
          # Grosszuegig gewaehlt, und das mit Grund: buildx legt neben dem
          # eigentlichen Image noch namenlose Beglaubigungs-Manifeste ab, auf
          # die "latest" verweist. Raeumt man die weg, ist latest kaputt.
          # Nach dem Verlust vom 21.09.2026 lieber ein paar Leichen zu viel
          # als eine zu wenig.
          min-versions-to-keep: 20
