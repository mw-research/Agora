# Alte Paketversionen aus der Registry raeumen - von Hand ausgeloest.
#
# Wozu: bis September 2026 legte der Bau-Workflow fuer JEDEN Commit auf main
# eine eigene Version mit einem sha-Namen an. Die bleiben dauerhaft liegen
# und halten alte Codestaende vor, die im Git laengst nicht mehr stehen. Der
# Bau-Workflow tut das nicht mehr; die Altlasten muessen aber einmal weg.
#
# Ausloesen: Actions -> "Paket aufraeumen" -> Run workflow.
#
# Was bleibt: latest und alles mit einem Versionsnamen (v1.2.3). Alles
# andere faellt weg. Das laesst sich NICHT rueckgaengig machen - deshalb
# kein automatischer Ablauf, sondern ein bewusster Klick.
#
# Zum Vorabsehen erst mit "nur_zeigen" laufen lassen: dann wird nichts
# geloescht, sondern nur aufgelistet, was betroffen waere.
name: Paket aufraeumen

on:
  workflow_dispatch:
    inputs:
      nur_zeigen:
        description: 'Nur auflisten, nichts loeschen'
        type: boolean
        default: true

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Zeigen, was da ist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Versionen des Pakets 'agora':"
          gh api --paginate \
            "/users/${{ github.repository_owner }}/packages/container/agora/versions" \
            --jq '.[] | "\(.id)  \(.metadata.container.tags // [] | join(",") // "(ohne Namen)")"' \
            || echo "Auflisten nicht moeglich - dann zeigt der naechste Schritt, was er tut."

      - name: Altlasten entfernen
        if: ${{ inputs.nur_zeigen == false }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: agora
          package-type: container
          owner: ${{ github.repository_owner }}
          # Nichts mit Namen latest oder v... anfassen. Alles andere - also
          # die alten sha-Versionen und namenlose Reste - faellt weg.
          ignore-versions: '^(latest|v.*)$'
          min-versions-to-keep: 0
