# Zeigt, was in der Container-Registry liegt. Liest nur, aendert nichts.
#
# Ausloesen: Actions -> "Paket zeigen" -> Run workflow.
#
# Wozu: von aussen laesst sich das nicht feststellen. Die Registry antwortet
# anonym fuer ein privates und fuer ein nicht vorhandenes Paket gleich (403),
# damit man ihre Existenz nicht abfragen kann. Nur ein Lauf mit dem Token des
# Repositories sieht wirklich nach.
#
# Die Paketliste des ganzen Kontos geht hier NICHT - dafuer braeuchte es ein
# persoenliches Token mit read:packages. Das Token eines Laufs kommt nur an
# die Pakete, die zu diesem Repository gehoeren, und das reicht.
name: Paket zeigen

on:
  workflow_dispatch:

jobs:
  zeigen:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Versionen von 'agora' auflisten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BESITZER: ${{ github.repository_owner }}
        run: |
          gh api --paginate "/users/$BESITZER/packages/container/agora/versions" \
            --jq '.[] | "\(.id)  \(.metadata.container.tags | join(",") // "(ohne Tag)")  \(.created_at)"' \
            || { echo "Kein Paket 'agora' oder kein Zugriff."; exit 1; }

          echo
          echo "Zu finden unter:"
          echo "  https://github.com/users/$BESITZER/packages/container/package/agora"
          echo "Sichtbarkeit aendern:"
          echo "  https://github.com/users/$BESITZER/packages/container/agora/settings"
